services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  lexai-api:
    build: .
    ports:
      - "5001:5001"
    depends_on:
      - redis
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/database.db}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  redis_data:
